  <section class="month" id="month">
    <div class="today-board">
      <h1 id="today-title"></h1>
      <div class="tap-hero"><strong id="tap-count"></strong><span id="tap-label"></span></div>
      <div id="puzzle-progress" class="jigsaw" aria-hidden="true"></div>
      <div class="split" aria-hidden="true"><i id="together-bar"></i><i id="apart-bar"></i></div>
      <div class="today-stats">
        <div class="is-together"><span id="together-label"></span><strong id="together-total"></strong></div>
        <div class="is-apart"><span id="apart-label"></span><strong id="apart-total"></strong></div>
      </div>
      <div class="session"><span id="duration"></span><button class="ghost" id="timer" type="button">함께한 시간 시작</button></div>
      <p id="timing-caption"></p>
    </div>

    <section class="calendar" aria-labelledby="calendar-title">
      <div class="calendar-header">
        <button id="calendar-prev" type="button" aria-label="이전 달">←</button>
        <div><strong id="calendar-title"></strong><span id="calendar-month" aria-live="polite"></span></div>
        <button id="calendar-next" type="button" aria-label="다음 달">→</button>
      </div>
      <p class="month-total" id="month-total"></p>
      <div class="calendar-week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="calendar-days" class="calendar-days jigsaw"></div>
      <div class="legend" id="month-legend"></div>
      <div id="calendar-report" class="calendar-report" aria-live="polite"></div>
      <div id="calendar-moments" class="moments"></div>
    </section>

    <details class="today-log">
      <summary id="today-log-title"></summary>
      <div id="moments" class="moments"></div>
      <p class="moment-status" id="moment-status"></p>
      <div class="log-actions">
        <button class="text-link" id="manual-moment" type="button"></button>
        <button class="text-link" id="details" type="button" hidden>순간에 이름 붙이기</button>
      </div>
    </details>
    <button class="ghost" id="again" type="button">애니메이션 다시 보기</button>
    <button class="ghost" id="demo" type="button" hidden>태깅 체험하기 · DEMO</button>
  </section>


  <div class="card reveal hide" id="card" hidden>
    <h2>이 순간에 이름 붙이기</h2>
    <div class="chips" role="group" aria-label="어떤 순간인가요">
      <button type="button" class="chip" data-cat="walk">산책</button>
      <button type="button" class="chip" data-cat="vet">병원</button>
      <button type="button" class="chip" data-cat="groom">미용·목욕</button>
      <button type="button" class="chip" data-cat="play">놀이</button>
      <button type="button" class="chip" data-cat="trip">카페·여행</button>
      <button type="button" class="chip" data-cat="etc">직접 입력</button>
    </div>
    <div class="sub" id="vetbox" hidden>
      <span class="label">왜 갔나요?</span>
      <div class="subchips" role="group" aria-label="병원 방문 이유">
        <button type="button" class="subchip">건강검진</button>
        <button type="button" class="subchip">예방접종</button>
        <button type="button" class="subchip">아파서</button>
        <button type="button" class="subchip">약 받기</button>
        <button type="button" class="subchip">기타</button>
      </div>
    </div>
    <input class="memo" id="memo" type="text" maxlength="60" autocomplete="off" placeholder="한 줄 메모 (선택)">
    <label class="photo-pick">사진 추가 (선택) <input id="photo" type="file" accept="image/*"></label>
    <button class="save" id="save" type="button">메모 저장</button>
    <p class="hint" id="hint"></p>
  </div>


  <p id="demo-note" class="note"></p>

<dialog id="pet-profile-dialog">
  <h2>반려동물·응급 정보</h2>
  <p>태그를 읽은 사람에게 공개할 정보만 입력하세요. 전화번호, 이메일, 집 주소는 입력하지 마세요.</p>
  <form id="pet-profile-form">
    <div class="avatar-field">
      <img id="avatar-preview" alt="">
      <div>
        <strong id="avatar-title"></strong>
        <label class="avatar-pick"><span id="avatar-pick-text"></span><input id="avatar-input" type="file" accept="image/*"></label>
        <button class="text-link" id="avatar-remove" type="button" hidden></button>
        <p id="avatar-status" role="status"></p>
      </div>
    </div>
    <label>나이 <input name="age" maxlength="30" placeholder="예: 4살"></label>
    <label>품종·특징 <input name="identity" maxlength="100"></label>
    <label>알레르기·약물 이상 반응 <textarea name="allergy" maxlength="180" placeholder="예: 알레르기 유발 물질과 나타난 반응"></textarea></label>
    <label>질환·복용 중인 약 <textarea name="medical" maxlength="220" placeholder="약 이름, 용량, 복용 간격"></textarea></label>
    <label>혈액형 (검사로 확인한 경우) <input name="blood" maxlength="40" placeholder="모르면 비워 두세요"></label>
    <label>동물등록용 마이크로칩 <select name="chip"><option value="">미기재</option><option>등록됨</option><option>미등록</option><option>모름</option></select></label>
    <label>접근 시 주의 사항 <textarea name="handling" maxlength="140"></textarea></label>
    <label>보호자 표시 이름 (선택) <input name="alias" maxlength="30" placeholder="예: 카카 보호자"></label>
    <button class="ghost" type="submit">공개 정보 저장하고 미리보기</button>
    <button class="ghost" id="pet-profile-close" type="button">닫기</button>
    <p id="pet-profile-status" role="status"></p>
  </form>
</dialog>

  document.querySelectorAll("option:not([value])").forEach(function(el){el.value=el.textContent.trim()});

  var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    var node=walker.currentNode,value=node.nodeValue.trim();
    if(translations[value]&&!node.parentElement.closest("script,style")){
      node.nodeValue=node.nodeValue.replace(value,tr(value));
    }
  }

  function elapsed(ms){
    var min=Math.floor(Math.max(0,ms)/60000);
    if(language!=="ko"){
      var hours=Math.floor(min/60),seconds=Math.floor(Math.max(0,ms)/1000);
      return tr("",(hours?hours+" 小时 ":"")+min%60+" 分钟"+(min===0?" "+seconds+" 秒":""),
        (hours?hours+" h ":"")+min%60+" min"+(min===0?" "+seconds+" s":""));
    }
